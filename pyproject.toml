[project]
name = "test-mdb-workflows"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bento-mdb",
    "mdb-changelog-runner>=1.0.3",
    "bento-mdf>=0.13.5",
    "bento-meta>=0.3.2",
    "pytest>=8.3.4",
]

[tool.uv]
package = true

[tool.uv.sources]
bento-mdb = { path = "./bento-mdb" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
run_minimdb = "test_mdb_workflows.run_minimdb:main"
load_changelog = "test_mdb_workflows.load_changelog:main"

[tool.pytest.ini_options]
addopts = ["--show-capture=no"]
testpaths = ["tests"]

[tool.hatch.build]
include = ["neodata", "model-desc", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["test_mdb_workflows"]

